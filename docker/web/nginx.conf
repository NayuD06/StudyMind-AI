# Hai trang tách cổng để cookie đăng nhập của sinh viên và của quản trị viên không lẫn nhau.
# /api chuyển về backend; mọi đường dẫn khác trả index.html để React Router tự xử lý.

# Lớn hơn giới hạn 20 MB của backend một chút, để backend là nơi trả thông báo lỗi dễ hiểu
client_max_body_size 21m;

server {
  listen 80;
  root /srv/frontend;
  include /etc/nginx/conf.d/app.inc;
}

server {
  listen 81;
  root /srv/admin;
  include /etc/nginx/conf.d/app.inc;
}
