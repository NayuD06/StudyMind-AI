# Kiểm tra tự động mỗi lần push lên main hoặc mở pull request.
# Mỗi phần của dự án là một job riêng, chạy song song; hỏng job nào thì biết ngay phần đó.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Push liên tiếp trên cùng một nhánh thì hủy lượt đang chạy dở, chỉ giữ lượt mới nhất
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: ${{ matrix.app }} (lint + build)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [frontend, admin]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      # build = tsc -b (kiểm tra kiểu) rồi vite build
      - run: npm run build

  backend:
    name: backend (build + migration)
    runs-on: ubuntu-latest
    # MySQL trống, chỉ sống trong lượt chạy này: dùng để thử áp toàn bộ migration từ đầu
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-root
          MYSQL_DATABASE: studymind
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      # Mật khẩu này chỉ dùng cho container tạm ở trên, không phải của môi trường thật nào
      DATABASE_URL: mysql://root:ci-only-root@127.0.0.1:3306/studymind
      SHADOW_DATABASE_URL: mysql://root:ci-only-root@127.0.0.1:3306/studymind_shadow
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - name: Áp migration lên database trống
        run: npx prisma migrate deploy
      - name: Tạo database phụ để so sánh schema
        run: mysql -h 127.0.0.1 -uroot -pci-only-root -e "CREATE DATABASE IF NOT EXISTS studymind_shadow"
      - name: schema.prisma phải khớp với migration (quên tạo migration thì hỏng ở đây)
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "$SHADOW_DATABASE_URL" --exit-code
      - run: npm run build

  ai-service:
    name: ai-service (cú pháp Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Chỉ kiểm tra cú pháp. Không cài requirements vì torch + sentence-transformers nặng vài GB.
      - run: python -m compileall -q ai-service/app
